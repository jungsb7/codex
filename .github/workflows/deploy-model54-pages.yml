name: Deploy verified model54 Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-model54-pages.yml'
      - 'handoff/pages-release-20261026/**'
      - 'handoff/pages-progress-20261030/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      pages: read
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Check out release tools
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: release-tools
          sparse-checkout: |
            handoff/pages-release-20261026
            handoff/pages-progress-20261030
          persist-credentials: false
      - name: Check out verified archive source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 9d272f862167a269dd721a5320e4d4eb5773346f
          path: source
          persist-credentials: false
      - name: Set up the verified Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Restore inputs and install isolated packaging tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = 9d272f862167a269dd721a5320e4d4eb5773346f
          test ! -e source/handoff/lossless-package-20261025
          cp -R release-tools/handoff/pages-release-20261026/packaging source/handoff/lossless-package-20261025
          node source/handoff/restore-inputs.cjs
          node --test source/handoff/lossless-package-20261025/codec.test.cjs
      - name: Create lossless package and preserve PNG pixels
        shell: bash
        run: |
          set -euo pipefail
          node source/handoff/lossless-package-20261025/build.cjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/package-checks"
          node source/handoff/lossless-package-20261025/finalize.cjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/package-checks" "$RUNNER_TEMP/final" "$RUNNER_TEMP/release-checks"
      - name: Verify AI queries, numerical bits, manifests and links
        shell: bash
        run: |
          set -euo pipefail
          node source/handoff/lossless-package-20261025/verify.cjs "$RUNNER_TEMP/final" "$RUNNER_TEMP/release-checks"
          node source/handoff/lossless-package-20261025/audit.cjs "$RUNNER_TEMP/final" "$RUNNER_TEMP/release-checks"
          node source/handoff/lossless-package-20261025/manifest-audit.cjs "$RUNNER_TEMP/final" "$RUNNER_TEMP/release-checks"
          node release-tools/handoff/pages-release-20261026/stage.cjs "$RUNNER_TEMP/final" "$RUNNER_TEMP/release-checks" "$RUNNER_TEMP/site"
          node release-tools/handoff/pages-progress-20261030/stage.cjs "$RUNNER_TEMP/site" "$RUNNER_TEMP/release-checks"
          git -C source diff --exit-code
          git -C source diff --cached --exit-code
          cat "$RUNNER_TEMP/release-checks/release-audit.json" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/release-checks/progress-audit.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload verified site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/site
          include-hidden-files: true
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

