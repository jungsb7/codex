<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이전 통합 화면 안내 · Planet Atlas</title><style>body{background:#142832;color:#e5dfcd;font:16px/1.9 system-ui;max-width:680px;margin:12vh auto;padding:25px}a{color:#e2c795}nav{margin:30px 0}</style><h1>이전 통합 화면 안내</h1><p>현재 공개 사이트에서는 최신 Atlas와 2차 정밀 지형, 계절 식량 장부를 제공합니다. 이전 단계의 별도 실행 화면은 공개 업로드 검토 제한으로 이번 배포 범위에서 제외했습니다.</p><nav><a href="atlas/index.html">최신 화면으로 이동 →</a></nav><p>최신 화면에서 9개 권역의 결과를 비교하고 좌표별 설계 지형을 확인할 수 있습니다. 이전 실행 파일은 보유하신 전체 인계 패키지에 그대로 남아 있습니다. 상세 지형은 설계 가정이며 기후·경제는 권역 단위 집계입니다.</p></html>
