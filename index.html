<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>행성 관측소</title><style>body{background:#101921;color:#e1edf4;font:17px system-ui;max-width:640px;margin:15vh auto;padding:24px}button{font:inherit;padding:8px 16px}</style><h1>행성 관측소</h1><p id="status" role="status">시뮬레이터를 불러오는 중입니다…</p><button onclick="location.reload()" hidden id="retry">다시 시도</button><script>
(async()=>{try{
if(!window.DecompressionStream)throw new Error('최신 Chrome, Edge, Firefox 또는 Safari로 열어 주세요.');
const files=["assets/planet-v0.76-00.bin", "assets/planet-v0.76-01.bin", "assets/planet-v0.76-02.bin", "assets/planet-v0.76-03.bin", "assets/planet-v0.76-04.bin", "assets/planet-v0.76-05.bin", "assets/planet-v0.76-06.bin", "assets/planet-v0.76-07.bin", "assets/planet-v0.76-08.bin", "assets/planet-v0.76-09.bin", "assets/planet-v0.76-10.bin"];
const chunks=await Promise.all(files.map(async name=>{const r=await fetch(new URL(name,location.href));if(!r.ok)throw new Error('파일을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.');return r.arrayBuffer();}));
const stream=new Blob(chunks).stream().pipeThrough(new DecompressionStream('gzip'));
const bytes=await new Response(stream).arrayBuffer();
const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),n=>n.toString(16).padStart(2,'0')).join('');
if(digest!=='4114e88d49231d57ebc35dec3466fdb69acedaa76af57473d4fd2acd6b365749')throw new Error('실행 파일 확인에 실패했습니다. 새로고침해 주세요.');
const html=new TextDecoder().decode(bytes);document.open();document.write(html);document.close();
}catch(e){document.getElementById('status').textContent=e.message;document.getElementById('retry').hidden=false;}})();
</script></html>
